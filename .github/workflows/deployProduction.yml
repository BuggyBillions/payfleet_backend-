name: Production Deploy Laravel API

on:
  push:
    branches:
      - production

  pull_request:
    branches:
      - production

jobs:
  validate-source:
    name: Validate PR Source
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Check source branch
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
        run: |
          if [ "$SOURCE_BRANCH" != "main" ]; then
            echo "::error::Only PRs from main to production are allowed."
            exit 1
          fi

          echo "Valid PR source branch."

  deploy:
    name: Deploy Laravel API
    
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy
        run: echo "Add your Laravel deployment commands here"

      - name: Write .env file
        run: |
          cat > .env << 'EOF'
          ${{ secrets.LARAVEL_PROD_ENV_FILE || secrets.LARAVEL_ENV_FILE }}
          EOF

      - name: Upload .env to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: ".env"
          target: "~/domains/payfleet.com.ng/public_html/apiProdLaravel"
          strip_components: 0

      - name: SSH Deploy
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e
            BASE_DIR=~/domains/payfleet.com.ng/public_html
            APP_DIR="$BASE_DIR/ Laravel"
            WEB_DIR="$BASE_DIR/apiprod"

            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            git config --global --add safe.directory "$APP_DIR" || true

            if [ ! -d ".git" ]; then
              echo "Initializing Git repository in $APP_DIR..."
              git init -b production
            fi

            git remote set-url origin https://github.com/${{ github.repository }}.git 2>/dev/null || git remote add origin https://github.com/${{ github.repository }}.git

            export GIT_TERMINAL_PROMPT=0
            git fetch origin production
            git checkout -B production origin/production
            git reset --hard origin/production
            chmod 600 "$APP_DIR/.env"

            composer install --no-dev --optimize-autoloader
            php artisan migrate --force || true
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:clear
            php artisan view:cache
            php artisan route:list --path='/'

            mkdir -p "$WEB_DIR"
            cp -f "$APP_DIR/public/.htaccess" "$WEB_DIR/.htaccess"
            mkdir -p "$APP_DIR/storage/app/public"

            if [ -L "$WEB_DIR/storage" ]; then
              echo "Existing storage symlink detected; leaving it in place"
            elif [ -e "$WEB_DIR/storage" ]; then
              echo "Existing storage path detected; preserving live files and copying new public assets without deletion"
              mkdir -p "$WEB_DIR/storage"
              cp -a "$APP_DIR/storage/app/public/." "$WEB_DIR/storage/"
            elif ln -s "$APP_DIR/storage/app/public" "$WEB_DIR/storage"; then
              echo "Storage symlink created successfully"
            else
              echo "Symlink not permitted, using storage copy fallback without deleting existing files"
              mkdir -p "$WEB_DIR/storage"
              cp -a "$APP_DIR/storage/app/public/." "$WEB_DIR/storage/"
            fi

            cat > "$WEB_DIR/index.php" <<'PHP'
            <?php

            use Illuminate\Contracts\Http\Kernel;
            use Illuminate\Http\Request;

            define('LARAVEL_START', microtime(true));

            if (file_exists($maintenance = __DIR__.'/../apiProdLaravel/storage/framework/maintenance.php')) {
                require $maintenance;
            }

            require __DIR__.'/../apiProdLaravel/vendor/autoload.php';

            $app = require_once __DIR__.'/../apiProdLaravel/bootstrap/app.php';

            $kernel = $app->make(Kernel::class);

            $response = $kernel->handle(
                $request = Request::capture()
            )->send();

            $kernel->terminate($request, $response);
            PHP
